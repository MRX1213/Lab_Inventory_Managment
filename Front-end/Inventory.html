<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/Inventory.css">
    <title>Lab Inventory - Inventory</title>
</head>
<body>
    <div class="page-wrapper">
        <nav class="sidebar">
            <h2>Lab Inventory</h2>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="inventory.html" class="active">Inventory</a></li>
                <li><a href="requests.html">Supply Requests</a></li>
                <li><a href="users.html">User Management</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
        <main class="content">
            <h1>Inventory</h1>
        
            <div class="inventory-layout">
                <section class="panel filters-panel">
                    <div class="filters">
                        <section class="Panel">
                            <div class="field">
                                <label for="Search-box">Search by item name or ID</label>
                                <input type ="text" id="Search-box"> 
                            </div>

                            <div class="field">
                                <label for ="filter-stock">Stock</label>
                                <select id = "filter-stock">
                                    <option value="all">All Items</option>
                                    <option value ="low">Low Stock</option>
                                    <option value="out">Out of stock</option>
                                </select>
                            </div>

                            <div class="field">
                                <label for="filter-space">Space</label>
                                <select id="filter-space">
                                    <option value="all">All Spaces</option>
                                </select>
                            </div>

                            <div class="field">
                                <label for="filter-location" >Location</label>
                                <select id="filter-location">
                                    <option value="all">All locations</option>
                                </select>
                            </div>

                            <div class="field">
                                <label for="filter-group">Group</label>
                                <select id="filter-group">
                                    <option value="all">All groups</option>
                                </select>
                            </div>
                        </section>
                    </div>
                </section>    
            
                <section class="panel table-panel">
                    <section class="Panel">
                        <table>
                            <h2>Items</h2>
                            <thead>
                                <tr>
                                    <th>Item Name</th>
                                    <th>Item ID</th>
                                    <th>Group/Sub Group</th>
                                    <th>Location</th>
                                    <th>Qty</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody id="item-table-body">
                                <tr>
                                    <td>PLA Black</td>
                                    <td>1</td>
                                    <td>Filament</td>
                                    <td>Makerspace</td>
                                    <td>12</td>
                                    <td>1.75mm spools</td>
                                </tr>
                            </tbody> 
                        </table> 
                    </section>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
