<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/user-management.css">
    <title>Lab Inventory - Inventory</title>
</head>
<body>
    <div class="page-wrapper">
        <nav class="sidebar">
            <h2>Lab Inventory</h2>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="inventory.html" class="active">Inventory</a></li>
                <li><a href="supply-requests.html">Supply Requests</a></li>
                <li><a href="locations.html">Locations</a></li>
                <li><a href="user-management.html">User Management</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
        <main class="content">
            <h1>Inventory</h1>
        
            <form id="item-form">
                <div class="panel">
                    <h2>Add Item</h2>
                    <div class="filters">
                        <div class="field">
                            <label for="item-name">Item Name</label>
                            <input type="text" id="item-name">
                        </div>

                        <div class="field">
                            <label for="item-group">Item Group</label>
                            <select id="item-group"></select>
                        </div>

                        <div class="field">
                            <label for="item-location">Item Location</label>
                            <select id="item-location"></select>
                        </div>

                        <div class="field">
                            <label for="item-qty">Item Qty</label>
                            <input type="number" id="item-qty" min="0" value="1">
                        </div>

                        <div class="field">
                            <label for="item-reorder">Low-stock level (optional)</label>
                            <input type="number" id="item-reorder" min="0">
                        </div>

                        <div class="field">
                            <label for="item-notes">Item Notes</label>
                            <textarea id="item-notes"></textarea>
                        </div>  
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn-primary">Save</button>
                        <button type="button" class="btn-secondary">Cancel</button> 
                    </div> 
                </div>
            </form>



            <div class="inventory-layout">
                <section class="panel filters-panel">
                    <div class="filters">
                            <div class="field">
                                <label for="search-box">Search by item name or ID</label>
                                <input type ="text" id="search-box"> 
                            </div>

                            <div class="field">
                                <label for ="filter-stock">Stock</label>
                                <select id = "filter-stock">
                                    <option value="all">All Items</option>
                                    <option value ="low">Low Stock</option>
                                    <option value="out">Out of stock</option>
                                </select>
                            </div>

                            <div class="field">
                                <label for="filter-space">Space</label>
                                <select id="filter-space">
                                    <option value="all">All Spaces</option>
                                </select>
                            </div>

                            <div class="field">
                                <label for="filter-location" >Location</label>
                                <select id="filter-location">
                                    <option value="all">All locations</option>
                                </select>
                            </div>

                            <div class="field">
                                <label for="filter-group">Group</label>
                                <select id="filter-group">
                                    <option value="all">All groups</option>
                                </select>
                            </div>
                    </div>
                </section>    
            
                <section class="panel table-panel">
                    <h2>Items</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Item Name</th>
                                    <th>Item ID</th>
                                    <th>Group/Sub Group</th>
                                    <th>Location</th>
                                    <th>Qty</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="item-table-body">
                                <tr>
                                    <td>PLA Black</td>
                                    <td>1</td>
                                    <td>Filament</td>
                                    <td>Makerspace</td>
                                    <td>12</td>
                                    <td>1.75mm spools</td>
                                    <td></td>
                                </tr>
                            </tbody> 
                        </table> 
                </section>
            </div>

            <div class="panel" id="groups-section">
                <div class="panel-header">
                    <h2>Groups</h2>
                    <button type="button" class="btn-primary" id="add-group-btn">+ Add group</button>
                </div>
                <form id="group-form">
                <div class="filters">       
                    <div class="field">
                        <label for="group-name">Group Name</label>
                        <input type="text" id="group-name">
                    </div>
                    <div class="field">
                        <label for="group-parent">Group Parent</label>
                        <select id="group-parent">

                        </select>
                    </div>
                </div>    
                    <div class="form-buttons">
                         <button type="submit" class="btn-primary">Save</button>
                        <button type="button" class="btn-secondary">Cancel</button> 
                    </div>
                 
                </form>
                <table>
                    <thead>
                        <tr>
                            <th>Group/Subgroup</th>
                            <th>Items</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="group-table-body">

                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="js/inventory.js"></script>
</body>
</html>
